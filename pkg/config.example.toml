bind = "127.0.0.1:3000"

# Optional: dashboard password (Bearer auth). If unset, dashboard is open.
# dashboard_password = "changeme"

# Optional: SQLite database path (defaults to proxai.db).
# db_path = "/var/lib/proxai/proxai.db"

# Optional: timezone for dashboard chart, e.g. "+07:00" (default: UTC).
# timezone = "+07:00"

# Optional: how many days of raw per-request usage rows to keep before
# folding them into per-(key, model) cumulative counters (default: 14).
# Keeps the database bounded no matter how long a key lives. Must be >= 7
# (the timeline chart's maximum range); lower values are clamped to 7.
# usage_retention_days = 14

# Add providers here. Example:
#
# DeepSeek (OpenAI-compatible). Base URL no longer uses /v1.
# Models: deepseek-v4-flash, deepseek-v4-pro.
# DeepSeek also offers an Anthropic-format endpoint at
# https://api.deepseek.com/anthropic; proxai routes the
# OpenAI-compatible endpoint below.
#
# [[providers]]
# name = "deepseek"
# url = "https://api.deepseek.com"
# api_key = "«redacted:sk-…»"
#
# Optional: only advertise these upstream model ids (empty = advertise all
# discovered models). Models the provider doesn't offer are skipped.
# models = ["deepseek-v4-flash", "deepseek-v4-pro"]
#
# [[providers]]
# name = "kimi"
# url = "https://api.moonshot.cn/v1"
# api_key = "«redacted:sk-…»"

# Optional: per-model properties to advertise on /v1/models.
#
# Key = the model's own name, as its provider calls it: "deepseek-v4-pro",
# "nemotron-3.5". NOT the namespaced id proxai advertises ("deepseek/deepseek-v4-pro").
# A model served by one provider is just itself, so no prefix is involved.
# Keys containing "." (or any punctuation TOML treats specially) must be
# quoted: [model_properties."nemotron-3.5"].
#
# The declared properties are overlaid on whatever the provider's own /models
# entry reported, config winning per key: a provider that reports no context
# window (or a wrong one) can be filled in or corrected. Every other key is
# advertised verbatim, so this table can carry any extra detail clients read.
# id/object/owned_by belong to the proxy and cannot be overridden.
# A key matching no advertised model, and a context_length outside the
# plausible 1024..10000000 window band, are dropped with a startup warning.

# [model_properties]
#
# [model_properties.deepseek-v4-pro]
# context_length = 1000000
# display_name = "DeepSeek V4 Pro"
# max_output_tokens = 65536
#
# [model_properties.deepseek-v4-flash]
# context_length = 131072
#
# [model_properties."nemotron-3.5"]
# context_length = 262144

[package]
name = "proxai-dashboard"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { version = "0.6", features = ["web"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-net = "0.6"
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
web-sys = { version = "0.3", features = ["Document", "Window"] }

[build-dependencies]
grass = "0.13"
